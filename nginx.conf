server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # ^~ y no un prefijo pelado: con ^~, nginx deja de mirar las expresiones
    # regulares en cuanto este prefijo es el mas largo que casa. Aqui dentro no
    # hay ninguna, pero la regla se mantiene por simetria con la del web, donde
    # SI importa y mucho (ver el comentario de alli).
    #
    # try_files con /designer/index.html al final: el designer es una SPA y sus
    # rutas —/designer/canvas, /designer/objects— no son ficheros. Sin esto,
    # recargar en cualquiera de ellas da 404.
    location ^~ /designer/ {
        try_files $uri $uri/ /designer/index.html;

        # Vite mete un hash en el nombre de cada asset, asi que un contenido
        # nuevo es un nombre nuevo y el navegador no necesita revalidar. El
        # index.html no lleva hash y queda fuera de esta regla a proposito.
        location ~ "^/designer/assets/.+\.(js|css|woff2?|ttf|otf|png|jpe?g|gif|svg|ico|webp)$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location = /designer/index.html {
        add_header Cache-Control "no-cache";
    }

    # Para el healthcheck del compose: responde sin depender de que el build
    # haya dejado nada en su sitio.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Cualquier otra cosa que llegue aqui es un error de enrutado del web, no
    # una peticion legitima: este contenedor solo sirve /designer/.
    location / {
        return 404;
    }
}
